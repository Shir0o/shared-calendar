<!DOCTYPE html>

<html class="light" lang="en"><head>

<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        
        /* Custom scrollbar for attendees */
        .attendee-scroll::-webkit-scrollbar {
            height: 4px;
        }
        .attendee-scroll::-webkit-scrollbar-track {
            background: transparent;
        }
        .attendee-scroll::-webkit-scrollbar-thumb {
            background-color: #c0c7d4;
            border-radius: 4px;
        }

        /* Toggle Switch Styles */
        .toggle-checkbox:checked {
            right: 0;
            border-color: #2b93ee;
        }
        .toggle-checkbox:checked + .toggle-label {
            background-color: #2b93ee;
        }
        .toggle-checkbox {
            right: 0;
            z-index: 1;
            border-color: #e0e2ea;
            transition: all 0.3s;
        }
        .toggle-label {
            width: 2rem;
            height: 1.25rem;
            background-color: #e0e2ea;
            border-radius: 9999px;
            transition: all 0.3s;
        }
    </style>

<!-- Modal Overlay Backdrop -->
<div class="fixed inset-0 bg-inverse-surface/10 backdrop-blur-md z-40 flex items-center justify-center p-4">

<style>
                @keyframes modalEntry {
                    from { opacity: 0; transform: scale(0.95) translateY(10px); }
                    to { opacity: 1; transform: scale(1) translateY(0); }
                }
            </style>
<!-- Header / Title Input -->
<div class="px-8 pt-8 pb-4">
<div class="flex justify-between items-start mb-2">
<input class="w-full bg-transparent border-none focus:ring-0 p-0 font-headline-lg text-headline-lg text-slate-text placeholder-outline-variant h-10" placeholder="Event Title" type="text" value="Personal Review &amp; Planning"/>
<button class="text-on-surface-variant hover:text-error transition-colors rounded-full p-1 hover:bg-error-container/50 ml-4">
<span class="material-symbols-outlined">close</span>
</button>
</div>
</div>
<!-- Scrollable Content Body -->
<div class="px-8 py-2 overflow-y-auto max-h-[70vh] flex flex-col gap-6">
<!-- Date & Time Row -->
<div class="flex flex-col gap-3">
<div class="flex flex-wrap md:flex-nowrap gap-4 items-center bg-surface-container-low rounded-xl p-2 border border-surface-container-highest">
<!-- Date Selector -->
<button class="flex items-center gap-2 px-4 py-2 hover:bg-white rounded-lg transition-colors flex-1 md:flex-none">
<span class="material-symbols-outlined text-secondary text-[20px]">calendar_today</span>
<span class="font-body-md text-on-surface whitespace-nowrap">Oct 24, 2023</span>
</button>
<div class="hidden md:block w-px h-6 bg-outline-variant/30"></div>
<!-- Time Selectors -->
<div class="flex items-center flex-1 justify-between md:justify-start gap-1 w-full md:w-auto">
<button class="flex items-center gap-2 px-4 py-2 hover:bg-white rounded-lg transition-colors flex-1 md:flex-none justify-center">
<span class="font-body-md text-on-surface font-medium">10:00 AM</span>
</button>
<span class="text-outline-variant material-symbols-outlined text-[16px]">arrow_forward</span>
<button class="flex items-center gap-2 px-4 py-2 hover:bg-white rounded-lg transition-colors flex-1 md:flex-none justify-center">
<span class="font-body-md text-on-surface font-medium">11:30 AM</span>
</button>
</div>
</div>
<!-- All Day Toggle -->
<div class="flex items-center justify-between px-2">
<span class="font-body-sm text-on-surface-variant">All-day event</span>
<div class="relative inline-block w-8 mr-2 align-middle select-none transition duration-200 ease-in">
<input class="toggle-checkbox absolute block w-4 h-4 rounded-full bg-white border-4 appearance-none cursor-pointer" id="toggle1" name="toggle" type="checkbox"/>
<label class="toggle-label block overflow-hidden h-4 rounded-full bg-gray-300 cursor-pointer" for="toggle1"></label>
</div>
</div>
</div>
<div class="h-px w-full bg-outline-variant/20 my-1"></div>

<div class="flex flex-col gap-3">
<div class="flex items-center gap-3">
<div class="w-8 h-8 rounded-full bg-surface-container flex items-center justify-center shrink-0 text-secondary">

</div>
<select class="flex-1 bg-surface-container-low border-none rounded-lg focus:ring-1 focus:ring-primary py-2 px-3 font-body-md text-on-surface">
<option>Does not repeat</option>
<option>Daily</option>
<option selected="">Weekly</option>
<option>Monthly</option>
<option>Custom...</option>
</select>
</div>
<!-- Days of week (visible for weekly) -->
<div class="flex gap-2 pl-11">
<button class="w-8 h-8 rounded-full flex items-center justify-center font-body-sm text-on-surface-variant bg-surface-container-high hover:bg-surface-variant transition-colors">S</button>
<button class="w-8 h-8 rounded-full flex items-center justify-center font-body-sm text-on-surface-variant bg-surface-container-high hover:bg-surface-variant transition-colors">M</button>
<button class="w-8 h-8 rounded-full flex items-center justify-center font-body-sm text-white bg-[#2b93ee] hover:bg-primary transition-colors">T</button>
<button class="w-8 h-8 rounded-full flex items-center justify-center font-body-sm text-on-surface-variant bg-surface-container-high hover:bg-surface-variant transition-colors">W</button>

<button class="w-8 h-8 rounded-full flex items-center justify-center font-body-sm text-on-surface-variant bg-surface-container-high hover:bg-surface-variant transition-colors">F</button>
<button class="w-8 h-8 rounded-full flex items-center justify-center font-body-sm text-on-surface-variant bg-surface-container-high hover:bg-surface-variant transition-colors">S</button>
</div>
</div>

<div class="flex flex-col gap-3">
<div class="flex items-center gap-3">
<div class="w-8 h-8 rounded-full bg-surface-container flex items-center justify-center shrink-0 text-secondary">
<span class="material-symbols-outlined text-[18px]">notifications</span>
</div>
<div class="flex flex-1 items-center gap-2">
<select class="flex-1 bg-surface-container-low border-none rounded-lg focus:ring-1 focus:ring-primary py-2 px-3 font-body-md text-on-surface">
<option selected="">10 minutes before</option>
<option>30 minutes before</option>
<option>1 hour before</option>
<option>1 day before</option>
</select>
<button class="text-primary hover:text-primary-container p-2 rounded-full hover:bg-surface-container transition-colors">
<span class="material-symbols-outlined text-[18px]">add</span>
</button>
</div>
</div>
</div>
<!-- Category/Color -->
<div class="flex items-center gap-3">
<div class="w-8 h-8 rounded-full bg-surface-container flex items-center justify-center shrink-0 text-secondary">
<span class="material-symbols-outlined text-[18px]">label</span>
</div>
<div class="flex gap-2">
<button class="w-6 h-6 rounded-full bg-[#ef4444] border-2 border-white shadow-sm hover:scale-110 transition-transform"></button>
<button class="w-6 h-6 rounded-full bg-[#f59e0b] hover:scale-110 transition-transform"></button>
<button class="w-6 h-6 rounded-full bg-[#10b981] hover:scale-110 transition-transform"></button>
